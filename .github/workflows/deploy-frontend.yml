name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "demo-ui/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo-ui/package-lock.json

      - name: Install dependencies
        working-directory: demo-ui
        run: npm ci

      - name: Build
        working-directory: demo-ui
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://gridwise-hackathon.onrender.com' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo-ui/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4